[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payloadwatch"
version = "0.1.0"
description = "Check the payload, not the status flag. A small watchdog for feeds that go stale while still returning 200."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["monitoring", "watchdog", "data-quality", "freshness", "alerting", "market-data"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/jancronje/payloadwatch"

[tool.hatch.build.targets.wheel]
packages = ["src/payloadwatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/payloadwatch/py.typed" = "payloadwatch/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
